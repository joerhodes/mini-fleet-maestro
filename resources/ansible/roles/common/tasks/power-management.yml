---
- name: Set power management settings
  become: true
  ansible.builtin.command: "pmset -a {{ pmset_setting.key }} {{ pmset_setting.value }}"
  loop:
    - { key: "sleep", value: "0" }
    - { key: "disablesleep", value: "1" }
    - { key: "autorestart", value: "1" }
    - { key: "womp", value: "1" }
    - { key: "displaysleep", value: "5" }
  loop_control:
    loop_var: pmset_setting
    label: "{{ pmset_setting.key }} {{ pmset_setting.value }}"
  changed_when: false

- name: Deploy pmset-enforcer LaunchDaemon
  become: true
  ansible.builtin.template:
    src: pmset-enforcer.plist.j2
    dest: /Library/LaunchDaemons/com.local.pmset-enforcer.plist
    owner: root
    group: wheel
    mode: "0644"
  notify: reload pmset enforcer
