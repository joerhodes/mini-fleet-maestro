---
- name: reload pmset enforcer
  become: true
  ansible.builtin.command: "launchctl bootout system/com.local.pmset-enforcer"
  failed_when: false
  changed_when: false

- name: reload pmset enforcer
  become: true
  ansible.builtin.command: "launchctl bootstrap system /Library/LaunchDaemons/com.local.pmset-enforcer.plist"
  listen: reload pmset enforcer

- name: Reboot to apply feature flags
  become: true
  ansible.builtin.reboot:
    msg: "Maestro: rebooting to apply FeatureFlags override"
    reboot_timeout: 600
