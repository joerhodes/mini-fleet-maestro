---
- name: Download and verify xmrig
  ansible.builtin.get_url:
    url: "{{ xmrig_download_url }}"
    dest: /tmp/xmrig.tar.gz
    checksum: "sha256:{{ xmrig_sha256 }}"

- name: Ensure xmrig install directory exists
  become: true
  ansible.builtin.file:
    path: "{{ xmrig_install_dir }}"
    state: directory
    owner: _xmrig
    group: staff
    mode: "0755"

- name: Extract xmrig tarball
  ansible.builtin.command: "tar -xzf /tmp/xmrig.tar.gz -C /tmp"
  args:
    creates: "/tmp/{{ xmrig_release_dir }}/xmrig"

- name: Install xmrig binary
  become: true
  ansible.builtin.copy:
    src: "/tmp/{{ xmrig_release_dir }}/xmrig"
    dest: "{{ xmrig_install_dir }}/xmrig"
    owner: _xmrig
    group: staff
    mode: "0755"
    remote_src: true
  ignore_errors: "{{ ansible_check_mode }}"
