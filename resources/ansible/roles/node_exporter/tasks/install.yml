---
- name: Download and verify node_exporter
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url }}"
    dest: /tmp/node_exporter.tar.gz
    checksum: "sha256:{{ node_exporter_sha256 }}"

- name: Ensure node_exporter install directory exists
  become: true
  ansible.builtin.file:
    path: "{{ node_exporter_install_dir }}"
    state: directory
    owner: _node_exporter
    group: staff
    mode: "0755"

- name: Extract node_exporter tarball
  ansible.builtin.command: "tar -xzf /tmp/node_exporter.tar.gz -C /tmp"
  args:
    creates: "/tmp/{{ node_exporter_release_dir }}/node_exporter"

- name: Install node_exporter binary
  become: true
  ansible.builtin.copy:
    src: "/tmp/{{ node_exporter_release_dir }}/node_exporter"
    dest: "{{ node_exporter_install_dir }}/node_exporter"
    owner: _node_exporter
    group: staff
    mode: "0755"
    remote_src: true
  notify: restart node_exporter
  ignore_errors: "{{ ansible_check_mode }}"
